<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Byonsoft Academy | Premium AI Learning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #050505; /* Pitch Black */
            color: #ffffff; 
            font-family: system-ui, -apple-system, sans-serif; 
            overflow-x: hidden;
        }

        /* 1. Background AI Floating Orbs */
        .ai-blob {
            position: absolute;
            filter: blur(90px);
            z-index: 0;
            opacity: 0.5;
            animation: moveBlob 15s infinite alternate ease-in-out;
        }
        .blob-1 { top: -10%; left: -10%; width: 400px; height: 400px; background: #eab308; } /* Yellow */
        .blob-2 { bottom: -20%; right: -10%; width: 500px; height: 500px; background: #a16207; animation-delay: -5s; } /* Deep Gold */

        @keyframes moveBlob {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(150px, 150px) scale(1.2); }
            100% { transform: translate(-50px, 50px) scale(0.9); }
        }

        /* 2. Typewriter Effect for AI Feel */
        .typewriter-container { display: inline-block; }
        .typewriter-text {
            overflow: hidden;
            white-space: nowrap;
            border-right: 3px solid #eab308;
            margin: 0 auto;
            animation: typing 3.5s steps(40, end), blink-caret .75s step-end infinite;
        }
        @keyframes typing { from { width: 0 } to { width: 100% } }
        @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: #eab308; } }

        /* 3. Smooth Floating Content */
        .floating { animation: float 6s ease-in-out infinite; }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        /* 4. Glowing AI Button Effect */
        .glow-btn { position: relative; z-index: 1; }
        .glow-btn::before {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            background: linear-gradient(45deg, #facc15, #ca8a04, #fef08a);
            z-index: -1;
            border-radius: inherit;
            filter: blur(12px);
            opacity: 0;
            transition: opacity 0.3s ease-in-out;
        }
        .glow-btn:hover::before { opacity: 1; animation: pulseGlow 1.5s linear infinite alternate; }
        @keyframes pulseGlow {
            0% { filter: blur(10px); }
            100% { filter: blur(20px); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative">
    
    <div class="ai-blob blob-1"></div>
    <div class="ai-blob blob-2"></div>

    <nav class="p-6 flex justify-between items-center border-b border-white/5 relative z-10 max-w-7xl mx-auto w-full backdrop-blur-sm">
        <div class="text-2xl font-black tracking-tighter cursor-pointer hover:scale-105 transition-transform">
            <span class="text-yellow-400">BYON</span>SOFT
        </div>
        <button class="border border-yellow-400/50 text-yellow-400 px-6 py-2 rounded-xl font-bold hover:bg-yellow-400 hover:text-black hover:shadow-[0_0_15px_rgba(250,204,21,0.5)] transition-all duration-300">
            Login
        </button>
    </nav>

    <main class="flex-1 flex flex-col justify-center items-center text-center px-4 mt-16 relative z-10 floating">
        
        <div class="inline-flex items-center gap-2 bg-yellow-400/10 border border-yellow-400/30 text-yellow-400 px-4 py-1.5 rounded-full text-sm font-bold mb-8 backdrop-blur-md">
            <span class="relative flex h-3 w-3">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-yellow-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-yellow-500"></span>
            </span>
            System Online
        </div>

        <h1 class="text-5xl md:text-7xl font-black mb-6 leading-tight tracking-tight">
            Master High-Income Skills <br/> 
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-yellow-500 to-yellow-600">
                Earn Real Money.
            </span>
        </h1>
        
        <div class="typewriter-container mb-10 h-8 md:h-10">
            <p class="typewriter-text text-gray-400 text-lg md:text-xl font-medium inline-block">
                Powered by AI Career Roadmap & Smart Mentorship.
            </p>
        </div>
        
        <div class="flex flex-col sm:flex-row gap-5 w-full sm:w-auto px-4 mt-4">
            <button class="glow-btn bg-yellow-400 text-black px-8 py-4 rounded-xl font-black text-lg hover:bg-yellow-300 transition-all w-full sm:w-auto transform hover:-translate-y-1">
                Get Started Free
            </button>
            <button class="bg-white/5 border border-white/10 text-white px-8 py-4 rounded-xl font-bold text-lg hover:bg-white/10 transition-all w-full sm:w-auto transform hover:-translate-y-1 backdrop-blur-md">
                Explore Courses
            </button>
        </div>

    </main>

    <footer class="border-t border-white/5 py-6 text-center text-gray-600 text-sm mt-20 relative z-10 backdrop-blur-sm">
        © 2026 Byonsoft Academy. Designed for the Future.
    </footer>

</body>
</html>
