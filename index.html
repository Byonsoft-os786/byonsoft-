<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Byonsoft Academy | Premium Learning</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #0a0a0a; /* Deep Premium Black */
            color: #ffffff; 
            font-family: system-ui, -apple-system, sans-serif; 
        }
    </style>
</head>
<body class="min-h-screen flex flex-col relative overflow-hidden">
    
    <div class="absolute top-[-10%] left-[50%] translate-x-[-50%] w-[600px] h-[400px] bg-yellow-500/20 blur-[120px] rounded-full pointer-events-none"></div>

    <nav class="p-6 flex justify-between items-center border-b border-white/10 relative z-10 max-w-7xl mx-auto w-full">
        <div class="text-2xl font-black tracking-tighter">
            <span class="text-yellow-400">BYON</span>SOFT
        </div>
        <button class="border-2 border-yellow-400 text-yellow-400 px-5 py-2 rounded-xl font-bold hover:bg-yellow-400 hover:text-black transition-all">
            Login
        </button>
    </nav>

    <main class="flex-1 flex flex-col justify-center items-center text-center px-4 mt-20 relative z-10">
        
        <div class="inline-flex items-center gap-2 bg-yellow-400/10 border border-yellow-400/30 text-yellow-400 px-4 py-1.5 rounded-full text-sm font-bold mb-8">
            <span class="relative flex h-3 w-3">
              <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-yellow-400 opacity-75"></span>
              <span class="relative inline-flex rounded-full h-3 w-3 bg-yellow-500"></span>
            </span>
            Version 2.0 is Live
        </div>

        <h1 class="text-5xl md:text-7xl font-black mb-6 leading-tight tracking-tight">
            Master High-Income Skills <br/> 
            <span class="text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-600">
                Earn Real Money.
            </span>
        </h1>
        
        <p class="text-gray-400 text-lg md:text-xl max-w-2xl mb-10 leading-relaxed">
            Join Byonsoft Academy. Learn premium digital skills, get your AI Career Roadmap, and secure your first client with our step-by-step guidance.
        </p>
        
        <div class="flex flex-col sm:flex-row gap-4 w-full sm:w-auto px-4">
            <button class="bg-yellow-400 text-black px-8 py-4 rounded-xl font-black text-lg hover:bg-yellow-300 hover:scale-105 transition-all shadow-[0_0_30px_rgba(250,204,21,0.3)] w-full sm:w-auto">
                Get Started Free
            </button>
            <button class="bg-white/5 border border-white/10 text-white px-8 py-4 rounded-xl font-bold text-lg hover:bg-white/10 transition-all w-full sm:w-auto">
                Explore Courses
            </button>
        </div>

    </main>

    <footer class="border-t border-white/10 py-6 text-center text-gray-500 text-sm mt-20 relative z-10">
        © 2026 Byonsoft Academy. All rights reserved.
    </footer>

</body>
</html>
